<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070b1c" />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tugasku" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO -->
    <title>Tugasku – Manajemen Tugas Produktif</title>
    <meta name="description" content="Tugasku adalah aplikasi manajemen tugas SaaS modern dengan Kanban board drag-and-drop. Kelola tugas harianmu dengan mudah, atur prioritas, dan tingkatkan produktivitasmu." />
    <meta name="author" content="Ido Refael Siregar" />
    <meta name="developer" content="Ido Refael Siregar — Idosiregar2006@gmail.com" />
    <meta name="keywords" content="manajemen tugas, kanban board, todo list, produktivitas, tugasku, task management" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tugasku – Manajemen Tugas Produktif" />
    <meta property="og:description" content="Kelola tugas harianmu dengan Kanban board modern. Gratis untuk memulai." />
    <meta property="og:site_name" content="Tugasku" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tugasku – Manajemen Tugas Produktif" />
    <meta name="twitter:description" content="Kelola tugas harianmu dengan Kanban board modern. Gratis untuk memulai." />

    <!-- Apply saved theme before React loads to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('tugasku-theme') || 'light';
          if (theme === 'light') {
            document.documentElement.classList.add('light');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f9fc');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
